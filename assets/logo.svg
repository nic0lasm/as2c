<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" aria-label="AS2C Patrimoine">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f2241"/>
    </linearGradient>
  </defs>
  <!-- Outer rounded shield -->
  <rect x="2" y="2" width="52" height="52" rx="10" fill="url(#g1)"/>
  <!-- Inner gold ornament line -->
  <rect x="6" y="6" width="44" height="44" rx="7" fill="none" stroke="#c8a04a" stroke-width="0.8" opacity="0.6"/>
  <!-- A S monogram -->
  <text x="28" y="36" font-family="Cormorant Garamond, Georgia, serif" font-size="26" font-weight="600" fill="#c8a04a" text-anchor="middle" letter-spacing="-1">AS</text>
</svg>
